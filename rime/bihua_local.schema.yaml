# Runtime code/configuration only. Generated commercial data is local research.
schema:
  schema_id: bihua_local
  name: "笔画 · 本地实验"
  version: "0.2.0"
switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]
  - name: simplification
    reset: 1
    states: [ 繁体, 简体 ]
engine:
  processors: [ "lua_processor@*bihua_learning_guard", ascii_composer, recognizer, key_binder, speller, punctuator, selector, navigator, express_editor ]
  segmentors: [ ascii_segmentor, abc_segmentor, punct_segmentor, fallback_segmentor ]
  translators: [ punct_translator, "lua_translator@*bihua_matcher" ]
  filters: [ simplifier, uniquifier, "lua_filter@*bihua_association_filter" ]
speller:
  alphabet: hspnz
translator:
  dictionary: bihua_local
  enable_user_dict: false
  enable_sentence: false
  enable_completion: true
bihua_matcher:
  character_learning: true
  personal_association: false
  static_association: false
  phrase_enabled: false
bihua_character:
  dictionary: bihua_local
  user_dict: bihua_mvp_character_v1
menu:
  page_size: 9
simplifier:
  option_name: simplification
  opencc_config: t2s.json
  tips: none
punctuator:
  import_preset: default
key_binder:
  import_preset: null
  bindings:
    - { when: always, accept: d, send: n }
    - { when: always, accept: KP_1, send: h }
    - { when: always, accept: KP_2, send: s }
    - { when: always, accept: KP_3, send: p }
    - { when: always, accept: KP_4, send: n }
    - { when: always, accept: KP_5, send: z }
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: has_menu, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
    - { when: has_menu, accept: "Shift+Tab", send: Page_Up }
    - { when: has_menu, accept: Tab, send: Page_Down }
    - { when: has_menu, accept: KP_Subtract, send: Page_Up }
    - { when: has_menu, accept: KP_Add, send: Page_Down }
    - { when: has_menu, accept: KP_0, send: space }
    - { when: has_menu, accept: KP_Enter, send: space }
    - { when: has_menu, accept: Return, send: space }
