schema:
  schema_id: bihua_mvp
  name: "笔画 · MVP"
  version: "0.1.0"
  description: "横竖撇点折：H S P D Z（N 兼容捺）/ 小键盘 1 2 3 4 5"

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]
  - name: simplification
    reset: 1
    states: [ 繁体, 简体 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: hspnz

translator:
  dictionary: bihua_mvp
  enable_completion: true
  enable_sentence: false
  enable_user_dict: false
  preedit_format:
    - xlit/hspnz/一丨丿丶乛/
  comment_format:
    - xform/~//
    - xlit/hspnz/一丨丿丶乛/

menu:
  page_size: 9

simplifier:
  option_name: simplification
  opencc_config: t2s.json
  tips: none

punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings:
    - { when: always, accept: d, send: n }
    - { when: always, accept: KP_1, send: h }
    - { when: always, accept: KP_2, send: s }
    - { when: always, accept: KP_3, send: p }
    - { when: always, accept: KP_4, send: n }
    - { when: always, accept: KP_5, send: z }
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: has_menu, accept: KP_6, send: Select }
    - { when: has_menu, accept: KP_7, send: Select }
    - { when: has_menu, accept: KP_8, send: Select }
    - { when: has_menu, accept: KP_9, send: Select }
    - { when: has_menu, accept: KP_0, send: Select }
